{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Gasto Calórico Total</h2>

  <form method="POST">
    <div class="mb-3">
      <label>TMB</label>
      <input type="number" step="0.1" name="tmb" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Factor de actividad</label>
      <select name="factor" class="form-control">
        <option value="1.2">Sedentario</option>
        <option value="1.375">Ligero</option>
        <option value="1.55">Moderado</option>
        <option value="1.725">Intenso</option>
        <option value="1.9">Muy intenso</option>
      </select>
    </div>

    <button class="btn btn-primary">Calcular</button>
  </form>

  {% if resultado %}
  <div class="alert alert-info mt-4">
    <strong>Tu gasto calórico total es: {{ resultado|round(1) }} kcal/día</strong>
  </div>
  {% endif %}
</div>
{% endblock %}
