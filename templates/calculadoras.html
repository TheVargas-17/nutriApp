{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-center">Calculadoras</h2>
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <form>

   
      <div class="mb-3">
        <label for="edad" class="form-label">Edad</label>
        <input type="number" class="form-control" id="edad" placeholder="Ej: 18">
    </div>
    
    <div class="mb-3">
        <label for="sexo" class="form-label">Sexo</label>
        <select class="form-control" id="sexo">
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
            <option value="otro">Otro</option>
        </select>
    </div>
    
    <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label>
        <input type="number" class="form-control" id="peso" placeholder="Ej: 70">
    </div>
    
    <div class="mb-3">
        <label for="altura" class="form-label">Altura (m)</label>
        <input type="number" step="0.01" class="form-control" id="altura" placeholder="Ej: 1.75">
    </div>
    
    <button type="button" class="btn btn-primary w-100" onclick="calcularIMC()">Calcular IMC</button>
    
    <div class="alert alert-success mt-3 text-center" id="resultado" style="display:none;"></div>
    
    <script>
    function calcularIMC() {
        const edad = parseInt(document.getElementById('edad').value);
        const sexo = document.getElementById('sexo').value;
        const peso = parseFloat(document.getElementById('peso').value);
        const altura = parseFloat(document.getElementById('altura').value);
    
        if (!edad || !sexo || !peso || !altura) {
            alert('¡Llena todos los campos antes de calcular!');
            return;
        }
    
        const imc = (peso / (altura * altura)).toFixed(2);
    
        let mensaje = '';
        if (imc < 18.5) mensaje = 'Bajo peso';
        else if (imc < 25) mensaje = 'Normal';
        else if (imc < 30) mensaje = 'Sobrepeso';
        else mensaje = 'Obesidad';
    
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.style.display = 'block';  
        resultadoDiv.innerHTML = `
            <strong>Tu IMC es ${imc}</strong> — ${mensaje}<br>
            <strong>Edad:</strong> ${edad} años <br>
            <strong>Sexo:</strong> ${sexo.charAt(0).toUpperCase() + sexo.slice(1)}
        `;
    }
    </script>
{% endblock %}
