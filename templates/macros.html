{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Macronutrientes</h2>

  <form method="POST">
    <div class="mb-3">
      <label>Calorías diarias</label>
      <input type="number" step="0.1" name="calorias" class="form-control" required>
    </div>

    <button class="btn btn-primary">Calcular</button>
  </form>

  {% if resultado %}
  <div class="alert alert-info mt-4">
    <p><strong>Proteínas:</strong> {{ resultado.proteinas }} g</p>
    <p><strong>Carbohidratos:</strong> {{ resultado.carbohidratos }} g</p>
    <p><strong>Grasas:</strong> {{ resultado.grasas }} g</p>
  </div>
  {% endif %}
</div>
{% endblock %}
