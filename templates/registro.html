{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Registro de Usuario</h3>

                    <form method="POST" action="/registro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" name="correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        </div>
                        <div class="mb-3">
                            <label for="sexo" class="form-label">Sexo</label>
                            <select class="form-select" id="sexo" name="sexo" required>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="number" step="any" class="form-control" id="peso" name="peso" required>
                        </div>
                        <div class="mb-3">
                            <label for="altura" class="form-label">Altura (cm)</label>
                            <input type="number" step="any" class="form-control" id="altura" name="altura" required>
                        </div>
                        <div class="mb-3">
                            <label for="actividad_fisica" class="form-label">Nivel de actividad física</label>
                            <select class="form-select" id="actividad_fisica" name="actividad_fisica" required>
                                <option value="Bajo">Bajo</option>
                                <option value="Moderado">Moderado</option>
                                <option value="Alto">Alto</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="objetivos" class="form-label">Objetivos</label>
                            <select class="form-select" id="objetivos" name="objetivos" required>
                                <option value="Bajar de peso">Bajar de peso</option>
                                <option value="Aumentar masa muscular">Aumentar masa muscular</option>
                                <option value="Mantener peso">Mantener peso</option>
                                <option value="Mejorar digestión">Mejorar digestión</option>
                                <option value="Controlar condición (diabetes, hipertensión)">Controlar condición</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alergias</label><br>
                            <input type="checkbox" name="alergias" value="Maní"> Maní<br>
                            <input type="checkbox" name="alergias" value="Mariscos"> Mariscos<br>
                            <input type="checkbox" name="alergias" value="Gluten"> Gluten<br>
                            <input type="checkbox" name="alergias" value="Lactosa"> Lactosa<br>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Intolerancias</label><br>
                            <input type="checkbox" name="intolerancias" value="Lactosa"> Lactosa<br>
                            <input type="checkbox" name="intolerancias" value="Gluten"> Gluten<br>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dietas</label><br>
                            <input type="checkbox" name="dietas" value="Vegana"> Vegana<br>
                            <input type="checkbox" name="dietas" value="Vegetariana"> Vegetariana<br>
                            <input type="checkbox" name="dietas" value="Keto"> Keto<br>
                            <input type="checkbox" name="dietas" value="Mediterranea"> Mediterranea<br>
                        </div>
                        <div class="mb-3">
                            <label for="alimentos_no_gustan" class="form-label">Alimentos que no te gustan</label>
                            <textarea class="form-control" id="alimentos_no_gustan" name="alimentos_no_gustan" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="experiencia_cocina" class="form-label">Nivel de experiencia en cocina</label>
                            <select class="form-select" id="experiencia_cocina" name="experiencia_cocina" required>
                                <option value="Principiante">Principiante</option>
                                <option value="Chef aficionado">Chef aficionado</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center border-top py-3 bg-light mt-5">
  <p class="text-muted small mb-0">
    “Dios no te pide ser perfecto, solo constante.”
  </p>
</footer>

{% endblock %}
